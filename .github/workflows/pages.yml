name: 웹페이지 배포

# 처음 설정할 때, 디자인(news/templates)을 바꿨을 때 실행해요. 저장된 기록으로 모든 페이지를 다시 만들어 올려요.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "news/templates/**"]

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 페이지 다시 만들기
        run: python -m news.main rebuild
      - name: 기록 저장
        run: |
          git config user.name "econ3-bot"
          git config user.email "econ3-bot@users.noreply.github.com"
          git add -A docs
          git commit -m "페이지 다시 만들기" || { echo "변경 없음"; exit 0; }
          # GitHub 쪽 일시 오류(예: fatal error in commit_refs)나 그사이 올라온 변경이 있으면 기다렸다가 다시 시도해요
          for wait in 10 20 30 0; do
            if git push; then exit 0; fi
            [ "$wait" = 0 ] && break
            echo "::warning::기록 저장 실패 — ${wait}초 뒤 다시 시도해요"
            sleep "$wait"
            git pull --rebase || git rebase --abort || true
          done
          echo "::error::기록 저장이 4번 모두 실패했어요. GitHub 쪽 문제일 가능성이 커요 (githubstatus.com 확인 후 다시 실행)."
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
