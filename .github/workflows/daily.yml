name: 오늘의 경제 3

on:
  schedule:
    # 한국시간 월~금 07:40 시작 (= UTC 일~목 22:40). 08:00에 맞춰 카톡을 보내요.
    - cron: "40 22 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "날짜 (비우면 오늘, 예: 2026-11-02)"
        required: false
        default: ""
      send:
        description: "카톡 보내기"
        type: boolean
        default: true

concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INPUT_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 뉴스 만들기
        run: python -m news.main build --date "$INPUT_DATE"

      - name: 지난 뉴스 기록 저장
        run: |
          git config user.name "econ3-bot"
          git config user.email "econ3-bot@users.noreply.github.com"
          git add docs
          git commit -m "오늘의 경제 3: $(date +%F)" || { echo "변경 없음"; exit 0; }
          # GitHub 쪽 일시 오류(예: fatal error in commit_refs)나 그사이 올라온 변경이 있으면 기다렸다가 다시 시도해요
          for wait in 15 30 45 60 75 0; do
            if git push; then exit 0; fi
            [ "$wait" = 0 ] && break
            echo "::warning::기록 저장 실패 — ${wait}초 뒤 다시 시도해요"
            sleep "$wait"
            git pull --rebase || git rebase --abort || true
          done
          echo "::error::기록 저장이 6번 모두 실패했어요. GitHub 쪽 문제일 가능성이 커요 (githubstatus.com 확인 후 다시 실행)."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/upload-artifact@v4
        with:
          name: state
          path: .state
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  send:
    needs: deploy
    if: github.event_name == 'schedule' || github.event.inputs.send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      NO_WAIT: ${{ github.event_name == 'workflow_dispatch' && '--no-wait' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: state
          path: .state
      - name: 페이지 반영 확인
        run: python -m news.main wait-pages
      - name: 카톡 보내기
        run: python -m news.main send $NO_WAIT

  notify-failure:
    needs: [build, deploy, send]
    if: failure()
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 실패 알림 카톡
        run: python -m news.main notify-failure
