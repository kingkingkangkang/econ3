<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>11/1(일) 오늘의 경제 3</title>
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#e6e4de;
  --macro:#2f5fd0; --macro-bg:#e8eefc;
  --market:#1f8a5b; --market-bg:#e3f4ec;
  --corporate:#7a4cc2; --corporate-bg:#f0e9fb;
  --korea-bg:#f2f6ff; --korea-line:#c9d7f7;
  --warn:#9a5b00; --warn-bg:#fff4e0; --warn-line:#f1d29a;
  --btn:#1d1d1f; --btn-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121214; --card:#1c1c1f; --text:#ececef; --muted:#a0a0a8; --line:#2c2c31;
    --macro:#8fb0ff; --macro-bg:#1d2a48;
    --market:#6fd3a3; --market-bg:#173327;
    --corporate:#c4a5f5; --corporate-bg:#2c2140;
    --korea-bg:#1a2233; --korea-line:#2e3d5e;
    --warn:#f3c26b; --warn-bg:#33270f; --warn-line:#5a4519;
    --btn:#ececef; --btn-text:#121214;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
a{color:inherit}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
h1{margin:4px 0 2px;font-size:26px;line-height:1.3}
.range{margin:0;font-size:13px;color:var(--muted)}
.toc{margin:18px 0 8px;padding:0;list-style:none;display:grid;gap:6px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;font-size:15px;line-height:1.45}
.toc .n{font-weight:800;color:var(--muted);min-width:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-top:14px;scroll-margin-top:12px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.num{width:24px;height:24px;border-radius:50%;background:var(--text);color:var(--card);display:inline-flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:800}
.chip{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.chip.macro{color:var(--macro);background:var(--macro-bg)}
.chip.market{color:var(--market);background:var(--market-bg)}
.chip.corporate{color:var(--corporate);background:var(--corporate-bg)}
.chip.warn{color:var(--warn);background:var(--warn-bg)}
.card h2{margin:10px 0 6px;font-size:20px;line-height:1.4}
.what{margin:0 0 8px;font-weight:600}
.details{margin:0;padding-left:18px}
.details li{margin:4px 0}
.glossary{margin-top:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.glossary summary{cursor:pointer;color:var(--muted);font-weight:700}
.glossary dt{font-weight:700;margin-top:6px}
.glossary dd{margin:0;color:var(--muted)}
.korea{margin-top:12px;padding:10px 12px;background:var(--korea-bg);border:1px solid var(--korea-line);border-radius:10px;font-size:15px}
.korea strong{color:var(--macro);margin-right:4px}
.notice{margin-top:10px;padding:10px 12px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;font-size:14px}
.notice strong{color:var(--warn)}
.notice p{margin:4px 0 0}
.src{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--btn);color:var(--btn-text);
  padding:8px 12px;border-radius:10px;font-size:14px;font-weight:700}
.paid{font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.empty{margin-top:18px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.site{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.site a{font-weight:700}
.list{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.list a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.list .d{font-weight:800}
.list .t{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.code-box{margin-top:16px;padding:16px;background:var(--card);border:2px solid var(--macro);border-radius:16px}
.code-box code{display:block;margin:8px 0;padding:10px;background:var(--bg);border-radius:8px;font-size:14px;word-break:break-all}
.code-box button{font:inherit;font-weight:700;padding:8px 14px;border-radius:10px;border:0;background:var(--btn);color:var(--btn-text)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">오늘의 경제 3</p>
  <h1>11월 1일 일요일</h1>
  <p class="range">수집 범위: 10/30(금) 08:00 ~ 11/1(일) 08:00 한국시간</p>
</header>


<div class="empty">오늘은 선정 기준을 통과한 기사가 없어요.</div>


<footer class="site">
  <p>5개 매체(Bloomberg·Nikkei Asia·CNN Business·CNBC·Yahoo Finance)의 기사 중 파급력·한국 연관성·새로움·후속성·설명 가능성 점수로 골랐어요. 특이사항 표시 기사는 무료 본문 없이 3개 이상 매체를 교차 확인해 요약했어요.</p>
  <p><a href="./index.html">지난 뉴스 모아보기 →</a></p>
</footer>

</div>
</body>
</html>
